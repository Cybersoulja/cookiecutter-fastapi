{% raw %}# Cloudflare Tunnel Configuration Example
#
# Copy this file to ~/.cloudflared/config.yml and update with your values
#
# Setup steps:
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create my-mcp-tunnel
# 3. cloudflared tunnel route dns my-mcp-tunnel mcp.yourdomain.com
# 4. Copy tunnel UUID and credentials path below
# 5. cloudflared tunnel run my-mcp-tunnel

# Your tunnel UUID (get from: cloudflared tunnel list)
tunnel: YOUR_TUNNEL_UUID_HERE

# Path to tunnel credentials file
credentials-file: /path/to/.cloudflared/YOUR_TUNNEL_UUID.json

# Ingress rules - route traffic to your local MCP server
ingress:
  # Route your domain to local MCP server
  - hostname: mcp.yourdomain.com
    service: http://localhost:8000
    originRequest:
      # Keep connections alive
      noTLSVerify: false
      # Connection timeout
      connectTimeout: 30s
      # Disable chunked encoding for SSE
      disableChunkedEncoding: true

  # Catch-all rule (required)
  - service: http_status:404

# Logging configuration
loglevel: info

# Metrics server (optional)
metrics: localhost:8081

# Retry configuration
retries: 5

# Grace period before shutdown
gracePeriod: 30s{% endraw %}
